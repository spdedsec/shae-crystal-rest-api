name: Release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Crystal
        run: |
          curl -fsSL https://crystal-lang.org/releases/shards.asc | gpg --dearmor -o /usr/share/keyrings/crystal-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/crystal-keyring.gpg] https://crystal-lang.org/crystal/ stable main" | tee /etc/apt/sources.list.d/crystal.list
          apt-get update && apt-get install -y crystal
      - name: Build
        run: make build
      - name: Create release
        run: |
          make release
          gh release create ${{ github.ref_name }} --title "${{ github.ref_name }}" --notes "SHAE Crystal REST API" dist/*.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
